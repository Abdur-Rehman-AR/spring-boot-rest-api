spring.application.name=api

# 1. The address of your local MySQL server and the database name (student_db)
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC

# 2. Your MySQL username (usually root)
spring.datasource.username=root

# 3. Your MySQL password (replace 'your_password' with your actual MySQL password)
spring.datasource.password=rohan

# 4. Automatically creates or updates the database tables based on your Java code
spring.jpa.hibernate.ddl-auto=update

# 5. Shows the exact SQL queries Spring executes in your terminal console
spring.jpa.show-sql=true